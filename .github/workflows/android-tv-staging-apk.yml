name: Android TV APK (staging)

on:
  push:
    branches:
      - staging/android-tv-app
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv-staging-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android TV debug APK
        run: gradle -p android-tv assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: the-quiet-ward-android-tv-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

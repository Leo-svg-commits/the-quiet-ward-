name: Build The Quiet Ward TV APK

on:
  push:
    branches:
      - staging/android-tv-app
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-android-tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out TV app branch
        uses: actions/checkout@v5
        with:
          ref: staging/android-tv-app

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android-tv

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-quiet-ward-android-tv-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Build The Quiet Ward TV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TV app branch
        uses: actions/checkout@v4
        with:
          ref: staging/android-tv-app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android-tv

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-quiet-ward-android-tv-debug
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
